# EMI Compat Minecraft compatibility manifest.
#
# This is the source of truth for supported targets and their build inputs. Keep
# the version list ordered from oldest to newest. build.gradle reads the target
# selected with -Pmc_version=<version> (default_version otherwise), and the
# GitHub workflows build and publish one jar per entry in supported_versions.
#
# Every target needs EMI and NeoForge. Integrated mods (Sophisticated, ...) are
# optional at runtime but are compiled against, so each target pins a version
# of every integrated mod too. EMI's newest release is for 1.21.1, so that is
# the only target for now. To add one, copy the 1.21.1 block, update every
# value, and append the version to supported_versions. Code that only compiles
# for some targets goes in src/compat/<source_family>/java.

default_version=1.21.1
supported_versions=1.21.1

version.1.21.1.java_version=21
version.1.21.1.source_family=mc-1.21.1
# Minecraft versions the jar is published for on CurseForge and Modrinth.
version.1.21.1.game_versions=1.21.1
version.1.21.1.minecraft_range=[1.21.1,1.21.2)
version.1.21.1.neoforge=21.1.252
version.1.21.1.neoforge_range=[21.1.0,)
version.1.21.1.parchment_minecraft=1.21.1
version.1.21.1.parchment_mappings=2024.11.17
# EMI has drawn recipe tree slot highlights since 1.0.21; every 1.21.1 build has them.
version.1.21.1.emi=1.1.24+1.21.1
version.1.21.1.emi_range=[1.1.0,)
# Sophisticated Core 1.4.16 stopped counting storage contents without a Crafting
# Upgrade, which is the behaviour this mod's highlight rule mirrors.
version.1.21.1.sophisticated_core=1.21.1-1.5.2.2343
version.1.21.1.sophisticated_core_range=[1.4.16,)
# Only used for the dev client run; the fix lives entirely in Sophisticated Core's menus.
version.1.21.1.sophisticated_backpacks=1.21.1-3.26.6.2174
version.1.21.1.sophisticated_storage=1.21.1-1.6.0.2136

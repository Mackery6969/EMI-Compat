version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Provided by Minecraft/NeoForge at runtime; this mod neither ships nor pins it.
      - dependency-name: "org.lz4:lz4-java"
